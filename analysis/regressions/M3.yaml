# =============================================================================
# M3  --  Self-preference bias variant of M1 (LLM-as-a-judge)
# =============================================================================
# Paper: Appendix "Full Results > Regressions > M3". One row per
# (generation, judge) pair over every LLM generation (including the LLM runs
# of the human-baseline task; human responses excluded), with the judge's
# individual fraud vote as the outcome. Pairs whose vote was unparseable are
# dropped. The M1 predictor is kept unchanged and the judge block (effect-coded
# judge severity, self-family and self-model slopes, judge x model and
# judge x scenario random effects) is added.
#
# The per-judge votes are joined from data/final/obs_data_per_score.parquet
# onto the M1-base processed state (same merges as M1), so Steps 1-2 are
# shared with M1 / M2.
#
#   Step 3 -- per-run processing (after M1-base Steps 1-2):
#     uv run hibayes-process --config analysis/regressions/M3.yaml \
#         --analysis-state analysis/regressions/out/M1-base/processed \
#         --out analysis/regressions/out/M3/processed
#
#   Step 4 -- fit (four NUTS chains):
#     uv run hibayes-model --config analysis/regressions/M3.yaml \
#         --analysis-state analysis/regressions/out/M3/processed \
#         --out analysis/regressions/out/M3
#
# Outputs land in analysis/regressions/out/M3/models/fraudbench_m3/.
#
# M3 has ~3x the rows of M1 (~895k pairs). Materialising the pointwise
# log-likelihood (n_draws x n_pairs) at conversion time is the single largest
# memory cost of the pipeline, so the builder disables it by default
# (store_log_likelihood: false) and the loo / waic / posterior_predictive
# checkers are therefore not enabled for this run.
# =============================================================================
platform:
  device_type: gpu
  gpu_memory_fraction: 0.9
  num_devices: 4          # one NUTS chain per GPU; omit to auto-detect (HiBayes then runs all chains vectorized on one GPU)
  chain_method: parallel

data_loader:
  paths:
    extracted_data:
      - data/final/obs_data.parquet

data_process:
  path:
    - src/fraudbench/analysis/regressions/process.py
  processors:
    - filter_ai_only
    - expand_to_judge_votes:
        path: "data/final/obs_data_per_score.parquet"
    - build_fraudbench_indices
    - build_judge_indices
    - select_outcome:
        outcome_column: "fraud_vote"

model:
  path: src/fraudbench/analysis/regressions/models.py
  models:
    - name: fraudbench_m3
      config:
        fit:
          chains: 4
        store_log_likelihood: false

check:
  path:
    - src/fraudbench/analysis/regressions/checkers.py
  checkers:
    - r_hat:
        threshold: 1.05
    - divergences
    - ess_bulk
    - ess_tail

# communicate: intentionally omitted (hibayes-model does not run communicators).
