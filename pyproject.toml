[project]
name = "fraudbench"
version = "0.1.0"
description = "FraudBench: a legal evaluation of AI deception (dataset, evaluation harness, and analysis code)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm",
    "numpy",
    "pandas",
    "jsonargparse",
    "tqdm",
    "openai",
    "anthropic>=0.115.0",
    "inspect-ai>=0.3.138", # Needed for HF Inference Providers
    "matplotlib",
    "google-genai>=1.57.0",
    "xai-sdk>=1.5.0",
    "faker>=40.1.2",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-litellm>=0.3.5",
    "procoder",
    "seaborn>=0.13.2",
    "pyarrow>=23.0.0",
    "hibayes[gpu]",
    "ptitprince>=0.3.1",
    "jax[cuda12]>=0.9.0",
    "scikit-learn>=1.8.0",
    "awscli>=1.42.61",
    "basemap>=2.0.0",
    "scipy>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudbench"]
# Ship non-Python data files (e.g. matplotlib stylesheets, prompt templates)
# so they are importable from an installed package, not just a source checkout.
include = [
    "src/fraudbench/**/*.mplstyle",
    "src/fraudbench/**/*.txt",
    "src/fraudbench/**/*.jsonl",
]

[tool.uv]
extra-build-dependencies = { xformers = ["torch"] }

[tool.uv.sources]
procoder = { git = "https://github.com/dhh1995/PromptCoder.git" }
hibayes = { git = "https://github.com/UKGovernmentBEIS/hibayes.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "statsmodels>=0.14.6",
]

[tool.pytest.ini_options]
addopts = '-m "not slow"'
markers = [
    "slow: finite-population Monte Carlo validation",
]
